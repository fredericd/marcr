# Build a CLI and attach it to a GitHub release: marcr on vX.Y.Z tags,
# marcr-rules on marcr-rules-vX.Y.Z tags. Run it by hand (Actions tab) for
# a tag pushed before this workflow existed.
name: Release

on:
  push:
    tags: ["v*", "marcr-rules-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (vX.Y.Z or marcr-rules-vX.Y.Z)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Oldest available runner: the binary links against its glibc.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      BIN: ${{ startsWith(inputs.tag || github.ref_name, 'marcr-rules-') && 'marcr-rules' || 'marcr' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p "$BIN"
      - name: Package
        run: |
          name=$BIN-${TAG#marcr-rules-}-${{ matrix.target }}
          mkdir "$name"
          cp "target/release/$BIN" LICENSE-MIT LICENSE-APACHE "$name"
          [ "$BIN" = marcr ] && cp README.md "$name" || cp marcr-rules/README.md "$name"
          tar czf "$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.BIN }}-*.tar.gz
          # "Latest" on the releases page stays the marcr CLI.
          make_latest: ${{ env.BIN == 'marcr' }}
