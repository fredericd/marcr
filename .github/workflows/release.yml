# Build a CLI and attach it to a GitHub release: marcr on vX.Y.Z tags,
# marcr-rules on marcr-rules-vX.Y.Z tags.
name: Release

on:
  push:
    tags: ["v*", "marcr-rules-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Oldest available runner: the binary links against its glibc.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      BIN: ${{ startsWith(github.ref_name, 'marcr-rules-') && 'marcr-rules' || 'marcr' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p "$BIN"
      - name: Package
        run: |
          name=$BIN-${GITHUB_REF_NAME#marcr-rules-}-${{ matrix.target }}
          mkdir "$name"
          cp "target/release/$BIN" LICENSE-MIT LICENSE-APACHE "$name"
          [ "$BIN" = marcr ] && cp README.md "$name" || cp marcr-rules/README.md "$name"
          tar czf "$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BIN }}-*.tar.gz
